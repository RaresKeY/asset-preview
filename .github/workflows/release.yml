name: Build release
on:
  workflow_dispatch:
    inputs:
      staged:
        description: Publish locally validated assets from the current draft release
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read release version
        run: echo "ASSET_PREVIEW_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Build runtime and standalone artifacts
        if: ${{ !inputs.staged }}
        run: |
          mkdir build-context
          git archive "$GITHUB_SHA" | tar -x -C build-context
          docker build -f packaging/Containerfile --build-arg SOURCE_COMMIT="$GITHUB_SHA" --target runtime -t ghcr.io/rareskey/asset-preview:${ASSET_PREVIEW_VERSION} build-context
          docker build -f packaging/Containerfile --build-arg SOURCE_COMMIT="$GITHUB_SHA" --target artifacts --output type=local,dest=release build-context
      - name: Build desktop formats
        if: ${{ !inputs.staged }}
        run: |
          docker build -f packaging/Packaging.Containerfile -t asset-preview-packaging .
          docker run --rm -v "$PWD:/project" -w /project asset-preview-packaging python3 packaging/extra-formats.py release --formats appimage deb rpm
          docker run --rm -v "$PWD:/project" -w /project archlinux:base-devel bash packaging/build-arch.sh /project/release
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          python3 packaging/extra-formats.py release --formats flatpak
      - name: Load locally validated container
        if: ${{ inputs.staged }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download ${ASSET_PREVIEW_VERSION} --dir release
          cd release && sha256sum -c SHA256SUMS
          gzip -dc asset-preview-${ASSET_PREVIEW_VERSION}-container.tar.gz | docker load
          docker tag localhost/asset-preview:${ASSET_PREVIEW_VERSION} ghcr.io/rareskey/asset-preview:${ASSET_PREVIEW_VERSION}
      - name: Install host graphics loaders
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0
      - name: Check standalone service
        run: |
          chmod +x release/asset-preview-${ASSET_PREVIEW_VERSION}-linux-x86_64.run
          export QT_QPA_PLATFORM=offscreen
          if ! release/asset-preview-${ASSET_PREVIEW_VERSION}-linux-x86_64.run start; then
            tail -30 "$HOME/.local/state/asset-preview/server.log"
            exit 1
          fi
          release/asset-preview-${ASSET_PREVIEW_VERSION}-linux-x86_64.run status --json
          release/asset-preview-${ASSET_PREVIEW_VERSION}-linux-x86_64.run stop
          cd release && sha256sum -c SHA256SUMS
      - name: Push private container package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/rareskey/asset-preview:${ASSET_PREVIEW_VERSION}
          docker tag ghcr.io/rareskey/asset-preview:${ASSET_PREVIEW_VERSION} ghcr.io/rareskey/asset-preview:latest
          docker push ghcr.io/rareskey/asset-preview:latest
          docker buildx imagetools inspect ghcr.io/rareskey/asset-preview:${ASSET_PREVIEW_VERSION}
          docker logout ghcr.io
      - name: Upload draft release for hardware validation
        if: ${{ !inputs.staged }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${ASSET_PREVIEW_VERSION} --draft --target "$GITHUB_SHA" --title "Asset Preview ${ASSET_PREVIEW_VERSION}" --notes-file packaging/release-notes.md release/*
      - name: Verify package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api users/rareskey/packages/container/asset-preview --jq '{name, visibility}'
          test "$(gh api users/rareskey/packages/container/asset-preview --jq .visibility)" = private
